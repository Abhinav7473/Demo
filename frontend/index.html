<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Principles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen bg-beige-50 font-sans text-stone-800 antialiased dark:bg-stone-950 dark:text-stone-200">
    <header class="border-b border-beige-200 bg-white/70 backdrop-blur dark:border-stone-800 dark:bg-stone-900/70">
      <div class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-beige-600 dark:text-beige-400">Information system</p>
        <h1 class="mt-2 font-serif text-3xl font-semibold text-stone-900 sm:text-4xl dark:text-beige-50">
          Nielsen's heuristics &amp; Wickens' principles
        </h1>
        <p class="mt-3 max-w-2xl text-stone-600 dark:text-stone-400">
          Ten usability heuristics for evaluating interfaces and thirteen principles of display design, each with a concrete example.
        </p>
      </div>
    </header>

    <main class="mx-auto grid max-w-6xl gap-8 px-4 py-8 sm:px-6 lg:grid-cols-[240px_1fr]">
      <aside class="space-y-6 lg:sticky lg:top-6 lg:self-start">
        <div>
          <label for="search" class="text-xs font-semibold uppercase tracking-wider text-stone-500">Search</label>
          <input
            id="search"
            type="search"
            placeholder="e.g. memory, color, error"
            class="mt-2 w-full rounded-lg border border-beige-200 bg-white px-3 py-2 text-sm placeholder:text-stone-400 focus:border-beige-500 focus:ring-2 focus:ring-beige-200 focus:outline-none dark:border-stone-700 dark:bg-stone-900 dark:focus:ring-beige-800"
          />
        </div>
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-stone-500">Source</p>
          <div id="sources" class="mt-2 flex flex-wrap gap-2 lg:flex-col"></div>
        </div>
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-stone-500">Category</p>
          <div id="categories" class="mt-2 flex flex-wrap gap-2"></div>
        </div>
      </aside>

      <section>
        <p id="count" class="mb-4 text-sm text-stone-500"></p>
        <div id="grid" class="grid gap-4 sm:grid-cols-2"></div>
      </section>
    </main>

    <dialog
      id="detail"
      class="m-auto w-[min(36rem,calc(100vw-2rem))] rounded-2xl border border-beige-200 bg-white p-0 text-stone-800 shadow-xl backdrop:bg-stone-900/40 dark:border-stone-700 dark:bg-stone-900 dark:text-stone-200"
    ></dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
