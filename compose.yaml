services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Single image: Node stage builds the frontend, Python stage runs FastAPI and serves it.
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://demo:demo@db:5432/demo
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        # Backend code: live-sync, uvicorn --reload picks it up
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - __pycache__/
            - requirements.txt
        - action: rebuild
          path: ./backend/requirements.txt
        # Frontend code: rebuild the image (re-runs the Node build stage)
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules/
            - dist/

  nginx:
    build: ./nginx
    ports:
      - "8089:80"
    depends_on:
      - app
    develop:
      watch:
        - action: sync+restart
          path: ./nginx/nginx.conf
          target: /etc/nginx/conf.d/default.conf

volumes:
  pgdata:
